name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q

  infrastructure:
    name: Infrastructure smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start infrastructure
        run: >
          docker compose up -d --build
          database api nginx prometheus postgres-exporter alertmanager telegram-notifier grafana

      - name: Wait for services and verify health endpoints
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/health \
              && curl --fail --silent --show-error http://localhost:8080/ready \
              && curl --fail --silent --show-error http://localhost:9090/-/ready \
              && curl --fail --silent --show-error http://localhost:9093/-/ready \
              && curl --fail --silent --show-error http://localhost:3000/api/health \
              && docker compose exec -T telegram-notifier python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8081/health').status == 200"; then
              exit 0
            fi
            sleep 2
          done
          echo "Infrastructure did not become ready in time."
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
