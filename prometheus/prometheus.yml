global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgresql
    static_configs:
      - targets: ["postgres-exporter:9187"]
